# The kernel is linked at a fixed address in the top 2 GiB of the address space (see kernel/kernel.ld).
[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static", "-C", "code-model=kernel"]

# The start-up stage gets no debugging record, and its header holds a hash of the file instead of the
# time it was built. So the same source always builds the same file, byte for byte, wherever it's built.
[target.x86_64-unknown-uefi]
rustflags = ["-C", "link-arg=/Brepro", "-C", "link-arg=/DEBUG:NONE"]
