[package]
name = "chat-computer"
version = "1.0.0"
description = "Chat Computer for Windows and Mac"
edition = "2021"
publish = false

[lib]
name = "chat_computer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
whoami = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
