# Chat Computer: let NetworkManager manage every network device.
#
# The stock /usr/lib/NetworkManager/conf.d/10-globally-managed-devices.conf
# limits NM to wifi/wwan so that server installs keep ethernet under
# systemd-networkd/netplan. Chat Computer has no admin to run netplan, so NM owns
# everything (wired + wifi) and brings links up automatically. An empty
# unmanaged-devices list overrides the stock file (later-sorted / same name in
# /etc wins over /usr/lib).
[keyfile]
unmanaged-devices=

[main]
# NM is the netplan renderer (see /etc/netplan/99-chatcomputer-nm.yaml); this keeps
# NM from also loading ifupdown's /etc/network/interfaces.
plugins=keyfile
