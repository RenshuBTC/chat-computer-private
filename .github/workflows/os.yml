# Chat Computer's own operating system (os/).
# - linux: builds it and checks the committed release file is exactly what this source builds; runs the font
#   engine's, text setting's, chimes', FAT, exFAT, NTFS, ZIP, Office, picture, BitLocker and registry readers',
#   Markdown reader's, memory file's, HID descriptors' and AML interpreter's tests (the last against ACPICA's acpiexec),
#   and the model engine's; checks the engine's programs for Linux (chatcomputer/brain/bin) and the tiny models
#   Chat Computer's tests use (tests/data/tiny-model.ccm, and tiny-seeing-model.ccm with a vision part) are exactly
#   what this source builds;
#   starts it in virtual PCs (QEMU with OVMF) and checks the screen and the clock; checks that a crash stops it
#   cleanly; starts it with Secure Boot enforced (signed with a test key the firmware trusts), checking the
#   firmware refuses it unsigned; types on PS/2 and USB keyboards (on ports, behind a hub, plugged in and out),
#   checking what comes out; rings a timer, recording its chime; runs its own model (a tiny one, found where the
#   app keeps its models, its answer the engine's on Linux; one that sees, shown a picture and a scanned page); has a test's script in place of the model hold a
#   conversation, keep it across a restart, and read files on a Windows drive (NTFS) with its tools, then on one
#   BitLocker encrypts, unlocked with its recovery key, on the PC's other drives, by the letters Windows' registry
#   gives them, and on USB drives as they come and go; and runs the firmware's own programs: a battery, an AC
#   adapter and a lid, an event, and the power button turning it off.
# - windows: signs the release file on real Windows, the way "Chat Computer Own System" does on a PC, and (when the
#   machine starts in UEFI mode) puts it on the start-up partition and in the power-on menu and takes it off again.
# - secure-boot-windows: starts the file Windows signed in a virtual PC whose firmware trusts only Microsoft's
#   keys and that key, with Secure Boot enforced.
# The pictures of the screen, the kernel's log and what Windows did are kept as the run's artifacts.
name: Own OS test
on:
  push:
    branches: [main]
    paths: ['os/**', 'chatcomputer/ui/assets/fonts/**', 'chatcomputer/brain/bin/**', 'chatcomputer/brain/models.json', 'tests/data/tiny-model.ccm', 'tests/data/tiny-seeing-model.ccm',
            'windows/own-os.ps1', 'windows/lib/OwnOs.ps1', 'windows/lib/Startup.ps1', 'tests/win_ci/own-os.ps1',
            '.github/workflows/os.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: os-test
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf python3-pil python3-cryptography sbsigntool dosfstools mtools gdisk xz-utils zip ntfs-3g acpica-tools
          pipx install virt-firmware
          rustup show   # installs the compiler pinned in os/rust-toolchain.toml
      - name: Font engine, text setting, chimes, FAT, exFAT, NTFS, ZIP, Office, PDF, picture, BitLocker and registry readers, cryptography, Markdown, memory file, HID and AML tests
        run: cargo test -p font -p text -p chime -p fat -p exfat -p ntfs -p zip -p office -p pdf -p picture -p bitlocker -p crypto -p registry -p markdown -p remember -p hid -p aml
      - name: The model engine's tests (on small models with random weights)
        run: cargo test -p model --features std
      - name: The engine's programs for Linux (x86-64 and ARM) and the tiny test model are what this source builds
        run: |
          sh model/release.sh --check
          cargo run -q -p model --features std --example tiny_model -- "$RUNNER_TEMP/tiny-model.ccm"
          cmp "$RUNNER_TEMP/tiny-model.ccm" ../tests/data/tiny-model.ccm
          cargo run -q -p model --features std --example tiny_model -- "$RUNNER_TEMP/tiny-seeing-model.ccm" seeing
          cmp "$RUNNER_TEMP/tiny-seeing-model.ccm" ../tests/data/tiny-seeing-model.ccm
      - name: Build, and check the release file is what this source builds
        run: |
          ./build.sh
          cmp out/esp/EFI/BOOT/BOOTX64.EFI release/chatcomputer.efi
          (cd release && sha256sum -c chatcomputer.efi.sha256)
      - name: Start in virtual PCs
        run: |
          ./check.py --no-build
          ./check.py --no-build --cpu qemu64 --memory 4096 --size 1024x768
          ./check.py --no-build --size 2560x1440 --memory 2048
      - name: Crashes stop cleanly
        run: |
          ./check.py --crash page-fault
          ./check.py --crash panic
          ./check.py --crash stack
          ./check.py --crash core
      - name: Secure Boot
        run: ./check.py --no-build --secure-boot
      - name: Sound (a timer's chime, recorded, on QEMU's HD Audio controllers and codecs)
        run: ./check.py --sound
      - name: Keyboards (PS/2; USB on ports and behind a hub, with MSI-X, MSI and no interrupts; IOMMUs)
        run: ./check.py --keyboard
      - name: The own model (a tiny one, found, read and asked; its answer the same as the engine's on Linux)
        run: ./check.py --model
      - name: A conversation (a test's script in place of the model; its tools, the screen, a mouse's wheel)
        run: ./check.py --chat
      - name: The web (the model's search and page reading, against a stand-in over TLS 1.3)
        run: ./check.py --web
      - name: The conversation kept across a restart (NVMe and SATA)
        run: ./check.py --remember
      - name: Files (Windows' drive, NTFS, read by the model's tools; a test's script asks)
        run: ./check.py --files
      - name: BitLocker (Windows' drive encrypted, unlocked with its recovery key typed, or its key in the clear)
        run: ./check.py --bitlocker
      - name: Other drives (a second NVMe SSD and SATA drives, by the letters Windows' registry gives them)
        run: ./check.py --drives
      - name: USB drives (a stick, a card reader's two slots, a stick of 4 KiB blocks; plugged in and out)
        run: ./check.py --usb
      - name: The firmware's programs (a battery, an AC adapter and a lid; an event; the power button)
        run: ./check.py --no-build --power
      - name: Keep the pictures and the log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: own-os-screens
          path: |
            os/out/*.png
            os/out/serial.log

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Sign on real Windows, and put it on the start-up partition
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\win_ci\own-os.ps1 -Out "$env:RUNNER_TEMP\signed"
      - name: Keep the signed file
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: own-os-signed-on-windows
          path: ${{ runner.temp }}/signed

  secure-boot-windows:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: own-os-signed-on-windows
          path: os/signed
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf python3-pil
          pipx install virt-firmware
      - name: Start the file Windows signed, with Secure Boot enforced
        run: |
          mkdir -p out/esp/EFI/BOOT
          cp release/chatcomputer.efi out/esp/EFI/BOOT/BOOTX64.EFI  # the unsigned one, which must be refused
          ./check.py --no-build --signed signed/chatcomputer.efi --cert signed/ChatComputer.cer
      - name: Keep the pictures and the log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: own-os-secure-boot-windows
          path: |
            os/out/*.png
            os/out/serial.log
