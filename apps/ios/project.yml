# Chat Computer for iPhone and iPad: chatcomputer.ai in an app of its own (a WKWebView), as the Android app is
# Chrome's. XcodeGen makes the Xcode project from this (.github/workflows/ios.yml):  xcodegen generate
name: ChatComputer
options:
  bundleIdPrefix: ai.chatcomputer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  ChatComputer:
    type: application
    platform: iOS
    sources: [ChatComputer]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.chatcomputer.app
        PRODUCT_NAME: Chat Computer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chat Computer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Chat Computer listens when you talk to it (Connect AirPods in the “/” list).
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Chat Computer turns what you say into text when you talk to it.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
