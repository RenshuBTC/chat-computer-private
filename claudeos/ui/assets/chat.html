<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeOS</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="chat.css">
</head>
<body>
<main id="column" aria-live="polite">
  <section id="welcome">
    <h1 id="greeting">Hello.</h1>
    <p id="hint">Talk to me, or type below. The Claude app on your phone works too.</p>
  </section>
  <section id="log"></section>
  <div id="live" class="you live"><span id="live-text"></span><span id="caret"></span></div>
</main>
<aside id="done" aria-label="What’s done">
  <h2 id="done-title">What’s done</h2>
  <p id="done-empty">What I do for you shows up here: sites I open, searches, files I change.</p>
  <ol id="done-list"></ol>
</aside>
<footer id="composer">
  <div id="box">
    <textarea id="input" rows="1" aria-label="Message"></textarea>
    <button id="send" type="button" tabindex="-1" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v6a3 3 0 0 1-3 3H6"/><path d="M10 10l-4 4 4 4"/></svg>
    </button>
  </div>
  <div id="status">
    <span id="mic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span id="mic-text"></span></span>
    <span id="model"></span>
  </div>
</footer>
<script src="md.js"></script>
<script src="chat.js"></script>
</body>
</html>
