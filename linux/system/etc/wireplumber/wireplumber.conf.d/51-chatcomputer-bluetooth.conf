# Chat Computer WirePlumber tuning for AirPods (and similar HFP headsets), for WirePlumber 0.5 (Fedora, on a Mac).
# The same settings as 51-chatcomputer-bluetooth.lua and 51-chatcomputer-policy.lua for WirePlumber 0.4 (Ubuntu):
#   * Hands-Free (the AirPods microphone) and A2DP (good playback), wideband speech (mSBC), SBC-XQ, the
#     headset's own volume buttons, and the native HFP backend (no oFono / ModemManager);
#   * start on A2DP, and switch to the headset profile while something is listening (Chat Computer is).
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag ]
  bluez5.enable-msbc = true
  bluez5.enable-sbc-xq = true
  bluez5.enable-hw-volume = true
  bluez5.hfphsp-backend = "native"
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf a2dp_sink ]
        bluez5.hw-volume = [ hfp_hf a2dp_sink ]
        device.profile = "a2dp-sink"
      }
    }
  }
]

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = true
  bluetooth.use-persistent-storage = true
}
