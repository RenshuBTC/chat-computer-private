# Chat Computer's first start on a Mac. Chat Computer Setup puts this file in place of Fedora's EFI/fedora/grub.cfg on
# Chat Computer's EFI partition (after keeping Fedora's as chatcomputer/fedora-grub.cfg). It starts Fedora's kernel the
# way Fedora's own boot entry does, but runs Chat Computer's set-up program (chatcomputer/firstboot.sh, on this EFI
# partition) instead of Fedora's first-start questions. That program puts Fedora's file back, so every later
# start is Fedora's usual one. The kernel version and file system ids are filled in from mac/manifest.sh.
#
# The quotes: GRUB takes "systemd.run=/bin/sh <file>" as one word and hands it to the kernel in double quotes,
# which systemd removes. (Quotes inside it would reach systemd as \" , which it doesn't read as quotes.)
# systemd.unit: systemd.run's own way of starting it loses to the default target Fedora's image sets in /etc.
search --fs-uuid --set=root @BOOT_UUID@
set prefix=($root)/grub2
echo 'Setting up Chat Computer...'
linux ($root)/vmlinuz-@KERNEL@ root=UUID=@ROOT_UUID@ rootflags=subvol=root "systemd.run=/bin/sh /boot/efi/chatcomputer/firstboot.sh" systemd.unit=kernel-command-line.target systemd.run_success_action=reboot systemd.run_failure_action=reboot
initrd ($root)/initramfs-@KERNEL@.img
boot
