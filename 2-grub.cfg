# ClaudeOS's first start on a Mac. ClaudeOS Setup puts this file in place of Fedora's EFI/fedora/grub.cfg on
# ClaudeOS's EFI partition (after keeping Fedora's as claudeos/fedora-grub.cfg). It starts Fedora's kernel the
# way Fedora's own boot entry does, but runs ClaudeOS's set-up program (claudeos/firstboot.sh, on this EFI
# partition) instead of Fedora's first-start questions. That program puts Fedora's file back, so every later
# start is Fedora's usual one. The kernel version and file system ids are filled in from mac/manifest.sh.
#
# The quotes: GRUB takes "systemd.run=/bin/sh <file>" as one word and hands it to the kernel in double quotes,
# which systemd removes. (Quotes inside it would reach systemd as \" , which it doesn't read as quotes.)
# systemd.unit: systemd.run's own way of starting it loses to the default target Fedora's image sets in /etc.
search --fs-uuid --set=root 65e9d770-9bc9-4b3f-9877-10347fb284e5
set prefix=($root)/grub2
echo 'Setting up ClaudeOS...'
linux ($root)/vmlinuz-7.1.6-400.asahi.fc44.aarch64+16k root=UUID=9db8788b-4718-404e-a6d0-1c9694d398fd rootflags=subvol=root "systemd.run=/bin/sh /boot/efi/claudeos/firstboot.sh" systemd.unit=kernel-command-line.target systemd.run_success_action=reboot systemd.run_failure_action=reboot
initrd ($root)/initramfs-7.1.6-400.asahi.fc44.aarch64+16k.img
boot
