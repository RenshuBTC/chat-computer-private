# Chat Computer's runtime on GitHub's Ubuntu, the system it installs on a PC: the Python tests, against the versions
# pinned in requirements-linux.txt (what runs on the PC) and requirements-dev.txt (what the tests need besides it).
# They are the whole conversation: the brain's agent loop, the model's server (the real engine, with a tiny model of
# random weights) and getting a model ready, the permission gate, the tools, the file index, the screen's layout and
# pages, the voice, Messages, the timers, undo, and the browser demo and apps the scripts build. The screen's own rendering
# checks (tests/test_rendering.py) need a virtual display and minutes of real GTK; a developer runs them by hand.
name: Runtime test
on:
  push:
    branches: [main]
    paths: ['chatcomputer/**', 'tests/**', 'scripts/**', 'docs/**', 'apps/**', 'pyproject.toml',
            'requirements-linux.txt', 'requirements-dev.txt', '.github/workflows/python.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-test
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: The system packages the runtime imports (the screen's GTK 4 and WebKitGTK through python3-gi, cairo,
          and PortAudio for sounddevice)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-venv python3-gi python3-cairo gir1.2-gtk-4.0 gir1.2-webkit2-4.1 \
            libportaudio2 libsndfile1 xz-utils
      - name: The environment Chat Computer Setup makes (a venv with the system's Python modules, then the pins)
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements-linux.txt -r requirements-dev.txt
      - name: The tests
        run: .venv/bin/python -m pytest -q --ignore=tests/test_rendering.py
