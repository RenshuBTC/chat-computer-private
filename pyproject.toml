[project]
name = "chatcomputer"
version = "0.2.0"
description = "Chat Computer: a voice-first, AI-native computer. An open model running on the computer itself is the interface; a thin Linux layer runs hidden underneath."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "onnxruntime>=1.17",
  "faster-whisper>=1.0",
  "kokoro-onnx>=0.4",
  "soxr>=0.3",
  "huggingface-hub>=0.20",
  "mss>=9.0",
  "pillow>=10.0",
  "psutil>=5.9",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "send2trash>=1.8",
  "regipy>=4.0",
  "telethon>=1.40",
]

[project.scripts]
chatcomputer = "chatcomputer.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
