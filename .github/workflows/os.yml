# Chat Computer's own operating system (os/).
# - linux: builds it and checks the committed release file is exactly what this source builds; runs the font
#   engine's, Markdown reader's and memory file's tests; starts it in virtual PCs (QEMU with OVMF) and checks the
#   screen and the clock; checks that a crash stops it cleanly; starts it with Secure Boot enforced (signed with a
#   test key the firmware trusts),
#   checking the firmware refuses it unsigned; and types on PS/2 and USB keyboards (on ports, behind a hub,
#   plugged in and out), checking what comes out.
# - windows: signs the release file on real Windows, the way "Chat Computer Own System" does on a PC, and (when the
#   machine starts in UEFI mode) puts it on the start-up partition and in the power-on menu and takes it off again.
# - secure-boot-windows: starts the file Windows signed in a virtual PC whose firmware trusts only Microsoft's
#   keys and that key, with Secure Boot enforced.
# The pictures of the screen, the kernel's log and what Windows did are kept as the run's artifacts.
name: Own OS test
on:
  push:
    branches: [main]
    paths: ['os/**', 'chatcomputer/ui/assets/fonts/**', 'windows/own-os.ps1', 'windows/lib/OwnOs.ps1',
            'windows/lib/Startup.ps1', 'tests/win_ci/own-os.ps1', '.github/workflows/os.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: os-test
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf python3-pil sbsigntool
          pipx install virt-firmware
          rustup show   # installs the compiler pinned in os/rust-toolchain.toml
      - name: Font engine, Markdown reader and memory file tests
        run: cargo test -p font -p markdown -p remember
      - name: Build, and check the release file is what this source builds
        run: |
          ./build.sh
          cmp out/esp/EFI/BOOT/BOOTX64.EFI release/chatcomputer.efi
          (cd release && sha256sum -c chatcomputer.efi.sha256)
      - name: Start in virtual PCs
        run: |
          ./check.py --no-build
          ./check.py --no-build --cpu qemu64 --memory 4096 --size 1024x768
          ./check.py --no-build --size 2560x1440 --memory 2048
      - name: Crashes stop cleanly
        run: |
          ./check.py --crash page-fault
          ./check.py --crash panic
      - name: Secure Boot
        run: ./check.py --no-build --secure-boot
      - name: Keyboards (PS/2; USB on ports and behind a hub, with MSI-X, MSI and no interrupts; IOMMUs)
        run: ./check.py --keyboard
      - name: Keep the pictures and the log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: own-os-screens
          path: |
            os/out/*.png
            os/out/serial.log

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Sign on real Windows, and put it on the start-up partition
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\win_ci\own-os.ps1 -Out "$env:RUNNER_TEMP\signed"
      - name: Keep the signed file
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: own-os-signed-on-windows
          path: ${{ runner.temp }}/signed

  secure-boot-windows:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: os
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: own-os-signed-on-windows
          path: os/signed
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 ovmf python3-pil
          pipx install virt-firmware
      - name: Start the file Windows signed, with Secure Boot enforced
        run: |
          mkdir -p out/esp/EFI/BOOT
          cp release/chatcomputer.efi out/esp/EFI/BOOT/BOOTX64.EFI  # the unsigned one, which must be refused
          ./check.py --no-build --signed signed/chatcomputer.efi --cert signed/ChatComputer.cer
      - name: Keep the pictures and the log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: own-os-secure-boot-windows
          path: |
            os/out/*.png
            os/out/serial.log
