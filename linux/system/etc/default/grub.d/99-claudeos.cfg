# ClaudeOS GRUB defaults. Sourced by grub-mkconfig after /etc/default/grub, so
# these win. Keep the menu short but visible: a non-technical user sees two
# clear choices (ClaudeOS / Windows) for 3 seconds, then boots ClaudeOS.

# Remember the last chosen entry; install-claudeos.sh runs
# `grub-set-default ClaudeOS` so the saved default is our entry on first boot.
GRUB_DEFAULT=saved
# Do not auto-select the previous boot's entry — always honour the saved default
# (ClaudeOS) unless the user picks Windows explicitly.
GRUB_SAVEDEFAULT=false

# Short, visible menu.
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu

# Our 07_claudeos generates the Windows entry (chainloading bootmgfw.efi), so we
# disable os-prober: it would add a duplicate, differently-named Windows entry.
GRUB_DISABLE_OS_PROBER=true

# Quiet, graphical boot into the splash; no verbose kernel log for the user.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"

# Keep recovery entries available under "Advanced options for Ubuntu".
GRUB_DISABLE_RECOVERY=false
