# ClaudeOS: autologin the ClaudeOS user on tty1.
#
# tty1 is the only console that logs in automatically; all other VTs keep the
# stock password-protected getty. The empty ExecStart= first line is required
# so systemd discards the unit's original ExecStart before adding ours.
#
# The literal token @CLAUDEOS_USER@ is replaced by install-claudeos.sh with the
# real username (we cannot know it until install time).
[Service]
ExecStart=
# --noissue: no "Ubuntu ... tty1" banner between the splash and ClaudeOS (~/.hushlogin hides the welcome text).
ExecStart=-/sbin/agetty --autologin @CLAUDEOS_USER@ --noclear --noissue %I $TERM
# Do not clear the screen between the splash and the shell, so boot stays quiet.
TTYVTDisallocate=no
