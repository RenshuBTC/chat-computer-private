# Chat Computer's own operating system: every piece of software from the firmware's hand-over to the screen.
# See README.md. Each crate is built for its own target by ./build.sh (cargo can't mix targets in one build).
[workspace]
resolver = "3"
members = ["bootinfo", "boot", "kernel", "font", "text", "chime", "net", "crypto", "tls", "fat", "exfat", "ntfs", "zip", "office", "picture", "bitlocker", "registry", "remember", "markdown", "hid", "aml", "model", "webengine", "web", "pdf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[profile.dev]
panic = "abort"
opt-level = 1

# Unlocking a BitLocker volume stretches its key with a million rounds of SHA-256, and the BitLocker reader's tests
# decrypt 2 GB: those two crates are optimized fully even when tested.
[profile.dev.package.bitlocker]
opt-level = 3

[profile.dev.package.crypto]
opt-level = 3

# The model's arithmetic: its tests read hundreds of tokens through small models, and it's the engine's whole speed.
[profile.dev.package.model]
opt-level = 3

[profile.release.package.model]
opt-level = 3

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
debug = false
