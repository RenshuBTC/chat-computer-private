# Chat Computer BlueZ settings (reference drop-in).
#
# IMPORTANT: BlueZ 5.72 as shipped in Ubuntu 24.04 does NOT read
# /etc/bluetooth/main.conf.d/ (drop-in support landed upstream but is not in
# this build — the bluetoothd binary references only "main.conf"). This file is
# therefore documentation + a template. install-chatcomputer.sh applies the same
# keys *idempotently into /etc/bluetooth/main.conf* (a dpkg conffile) using
# marked edits. If a future BlueZ enables conf.d, this file takes over cleanly.
#
# Goal: AirPods reconnect fast and reliably.

[General]
# Keep classic BR/EDR + LE both available. We deliberately do NOT force
# ControllerMode = bredr here (see 90-chatcomputer-bredr-fallback.conf for the
# documented fallback if a specific adapter only reconnects classic cleanly).
ControllerMode = dual
# Answer paging faster so a returning headset reconnects quickly (costs a little
# idle power — fine for a desktop).
FastConnectable = true
# Treat "just works" re-pairing from a previously bonded device as acceptable,
# which is how AirPods behave on reconnect.
JustWorksRepairing = always

[Policy]
# Power on every controller as soon as it appears, so Bluetooth is live before
# the user speaks — no manual `bluetoothctl power on`.
AutoEnable = true
# Retry reconnecting a bonded device several times before giving up.
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
